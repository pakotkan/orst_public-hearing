# Development mode: live reload for frontend and backend, no rebuilds.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Then open http://localhost:5173. Edit files under frontend/ or backend/ and save.
# Source folders are mounted into the containers; node_modules stay inside Docker volumes.
services:
  # Expose Postgres to the host so tools like DBeaver can connect (localhost:5432).
  db:
    ports:
      - '5432:5432'

  api:
    # nodemon polls for changes because Windows folder events don't reach Linux containers.
    command: >
      sh -c "bun install --frozen-lockfile &&
             bunx prisma generate &&
             bunx prisma migrate deploy &&
             bun run dev:docker"
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
      - uploads:/app/uploads
    ports:
      - '3001:3001'

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:3001
      # File change events from Windows folders don't reach Linux containers reliably, so poll instead.
      VITE_POLLING: 'true'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - api

  # Nginx isn't needed in dev: Vite serves the app and proxies /api and /uploads to the backend.
  nginx:
    profiles: [prod]

volumes:
  api_node_modules:
  frontend_node_modules:
